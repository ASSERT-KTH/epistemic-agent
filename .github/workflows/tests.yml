name: tests

on:
  push:
    branches: [main, carmine-dev]
  pull_request:

# The ASSERT-KTH organization only allows actions pinned to a full commit SHA.
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Run tests (no network, no API key; live tests are skipped)
        run: uv run pytest -q
